name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Clone Loom fork
        run: git clone https://github.com/namin/loom.git -b lemma ../loom
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
      - name: Build Velvet
        run: lake build Velvet